apiVersion: apps/v1
kind: Deployment
metadata:
  name: grow-community-deployment
  labels:
    app: grow-community
spec:
  replicas: 2
  selector:
    matchLabels:
      app: grow-community
  template:
    metadata:
      labels:
        app: grow-community
    spec:
      containers:
      - name: grow-community-container
        image: maybsubin/community:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3006
        envFrom:
        - configMapRef:
            name: grow-community-config
        - secretRef:
            name: grow-community-secret
---
apiVersion: v1
kind: Service
metadata:
  name: community
spec:
  type: ClusterIP
  selector:
    app: grow-community
  ports:
    - protocol: TCP
      port: 3006
      targetPort: 3006